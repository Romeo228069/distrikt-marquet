<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta property="og:title" content="Distrikt Marquet Feedback"><meta property="og:description" content="Bewerten, kommentieren, Favoriten setzen."><meta property="og:image" content="https://romeo228069.github.io/distrikt-marquet/m/endkarte_b.jpg"><style>body{margin:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>Distrikt Marquet Feedback</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Urbanist:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FDFBF1; --paper:#F6F2E2; --card:#FFFFFF; --ink:#2A2928; --ink2:#6E6B55; --line:#E6E0C8;
  --olive:#515227; --kala:#38381A; --citron:#FFE17A; --accent:#515227; --on-accent:#FDFBF1;
  --ok:#3F6B3A; --mid:#B8860B; --no:#9B2D1F;
  --serif:"DM Serif Display",Georgia,serif; --sans:"Urbanist","Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#1E1D19; --paper:#26251F; --card:#2C2B24; --ink:#F3F0E2; --ink2:#B9B596; --line:#3C3A30;
  --accent:#FFE17A; --on-accent:#2A2928; --ok:#8CC084; --mid:#E6C15A; --no:#F08A76;
}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#1E1D19; --paper:#26251F; --card:#2C2B24; --ink:#F3F0E2; --ink2:#B9B596; --line:#3C3A30;
  --accent:#FFE17A; --on-accent:#2A2928; --ok:#8CC084; --mid:#E6C15A; --no:#F08A76;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--sans);padding-inline:16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
em{font-family:var(--serif);font-style:italic;font-weight:400}
.lab{font:700 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}

/* Kopf */
.kopf{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.kopf .wrap{display:flex;align-items:center;gap:16px}
.kopf .marke{display:flex;align-items:center;gap:12px;min-width:0}
.kopf .marke svg{height:30px;width:auto;flex:none}
.kopf .marke .lab{white-space:nowrap}
.kopf .rechts{margin-left:auto;display:flex;align-items:center;gap:10px}
.fort{display:flex;align-items:center;gap:8px;font:600 13px/1 var(--sans);color:var(--ink2);font-variant-numeric:tabular-nums}
.ring{width:26px;height:26px}
.ich{display:flex;align-items:center;gap:8px;font:600 13px/1 var(--sans)}
.ich img{width:26px;height:26px;border-radius:50%}
.knopf{height:34px;padding:0 14px;border-radius:99px;background:var(--accent);color:var(--on-accent);font:700 12px/34px var(--sans);letter-spacing:.06em;text-transform:uppercase}
.knopf.leise{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
@media (max-width:720px){.kopf .marke .lab,.ich span{display:none}}

/* Fluss */
.intro{padding-block:48px 8px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.intro h1{margin:0;font:400 clamp(40px,6.4vw,76px)/1 var(--serif);font-style:italic;letter-spacing:-.01em}
.intro h1 b{font:600 1em/1 var(--sans);font-style:normal;letter-spacing:-.02em}
.fluss{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line)}
.phase{padding:16px 16px 0 0;display:grid;gap:10px;align-content:start;position:relative}
.phase::before{content:"";position:absolute;top:-4px;left:0;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.phase .lab{color:var(--ink)}
.schritte{display:flex;flex-wrap:wrap;gap:6px}
.schritt{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 6px;border-radius:99px;background:var(--paper);font:600 13px/1 var(--sans);color:var(--ink);text-decoration:none;transition:background .15s ease}
.schritt:hover{background:var(--line)}
.schritt i{font:700 10px/22px var(--sans);font-style:normal;width:22px;height:22px;border-radius:50%;text-align:center;background:var(--card);color:var(--ink2)}
.schritt.fertig i{background:var(--accent);color:var(--on-accent)}
.legende{display:flex;flex-wrap:wrap;gap:16px;color:var(--ink2);font:600 12px/1 var(--sans)}
.legende span{display:flex;align-items:center;gap:6px}
@media (max-width:720px){.fluss{grid-template-columns:1fr 1fr;row-gap:18px}}

/* Abschnitte */
.abschnitt{padding-block:72px 8px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px;scroll-margin-top:70px}
.abschnitt > *,.karte,.info{min-width:0}
.ab-kopf{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
.ab-kopf .nr{font:600 13px/1 var(--sans);color:var(--ink2);font-variant-numeric:tabular-nums}
.ab-kopf h2{margin:0;font:400 clamp(30px,4vw,46px)/1 var(--serif);font-style:italic}
.ab-kopf .sub{color:var(--ink2);font-weight:600}
.ab-kopf .stand{margin-left:auto}

.raster{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.raster.gross{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
@media (max-width:520px){.raster,.raster.gross{grid-template-columns:1fr 1fr;gap:12px}.urteil button{height:32px}}

.karte{background:var(--card);border-radius:var(--r);overflow:hidden;display:grid;box-shadow:0 1px 0 var(--line),0 12px 30px -24px rgba(42,41,40,.35);transition:box-shadow .2s ease,transform .2s ease}
.karte:hover{box-shadow:0 1px 0 var(--line),0 18px 40px -22px rgba(42,41,40,.45)}
.medium{position:relative;aspect-ratio:9/16;background:#111;cursor:zoom-in}
.medium.quer{aspect-ratio:16/10}
.medium video,.medium img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.medium .fav{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(20,20,16,.5);color:#fff;backdrop-filter:blur(6px);display:grid;place-items:center}
.medium .fav svg{width:18px;height:18px}
.medium .fav.an{background:var(--citron);color:#2A2928}
.medium .favzahl{position:absolute;top:14px;right:50px;font:700 12px/1 var(--sans);color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.info{padding:12px 12px 12px;display:grid;gap:10px}
.titel{display:flex;align-items:baseline;gap:8px;min-width:0}
.titel b{font:600 15px/1.2 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titel span{color:var(--ink2);font-size:13px;white-space:nowrap}
.urteil{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.urteil button{height:34px;border-radius:10px;background:var(--paper);display:flex;align-items:center;justify-content:center;gap:6px;font:700 13px/1 var(--sans);color:var(--ink2);font-variant-numeric:tabular-nums;transition:background .15s ease,color .15s ease}
.urteil button svg{width:15px;height:15px}
.urteil button.an[data-w="ok"]{background:var(--ok);color:#fff}
.urteil button.an[data-w="mid"]{background:var(--mid);color:#fff}
.urteil button.an[data-w="no"]{background:var(--no);color:#fff}
.urteil button:disabled{cursor:default;opacity:.55}
.gespraech{display:grid;gap:6px}
.gespraech .zeile{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.35}
.gespraech .zeile img{width:18px;height:18px;border-radius:50%;flex:none;margin-top:1px}
.gespraech .zeile b{font-weight:700}
.eingabe{width:100%;min-height:34px;max-height:120px;resize:vertical;border:0;border-radius:10px;background:var(--paper);color:var(--ink);font:500 13px/1.4 var(--sans);padding:8px 10px}
.eingabe::placeholder{color:var(--ink2)}
.mehr{justify-self:start;font:700 12px/1 var(--sans);color:var(--ink2);padding:4px 0}

/* Sonderkarten */
.breit{grid-column:1/-1}
.ci{display:grid;grid-template-columns:1.2fr 1fr;min-height:360px}
.ci .buehne{background:#515227;color:#fff;position:relative;overflow:hidden;display:grid;place-items:center;padding:40px}
.ci .buehne svg.logo{width:min(360px,70%);height:auto;position:relative}
.ci .buehne svg.q{position:absolute;right:-18%;top:-22%;width:78%;opacity:.5}
.ci .buehne svg.q path{fill:none;stroke:#FFE17A;stroke-width:2;vector-effect:non-scaling-stroke}
.ci .seite{padding:24px;display:grid;gap:20px;align-content:center}
.farben{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-radius:10px;overflow:hidden}
.farben div{min-width:0;aspect-ratio:1/1.2;display:flex;align-items:flex-end;padding:8px;font:700 10px/1.2 var(--sans);letter-spacing:.04em;overflow-wrap:anywhere;hyphens:auto}
@media (max-width:520px){.farben div{padding:6px;font-size:9px}}
.probe{font:600 clamp(26px,3vw,38px)/1.05 var(--sans);letter-spacing:-.01em}
.probe em{color:var(--accent)}
.schriften{display:flex;gap:18px;color:var(--ink2);font:600 12px/1 var(--sans)}
@media (max-width:760px){.ci{grid-template-columns:1fr}}
.markt{display:grid;grid-template-columns:1fr 1.4fr}
.zahlen{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:18px;align-content:center}
.zahl b{display:block;font:400 clamp(34px,4vw,48px)/1 var(--serif);font-style:italic;color:var(--accent);font-variant-numeric:tabular-nums}
.zahl span{font:600 12px/1.3 var(--sans);color:var(--ink2)}
.bilder{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--paper);padding:4px}
.bilder img{width:100%;height:100%;object-fit:cover;aspect-ratio:3/4;border-radius:8px}
.markt a{color:var(--ink);font:700 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase}
@media (max-width:760px){.markt{grid-template-columns:1fr}}
.spots{display:grid;gap:8px}
.spots .reihe{display:grid;grid-template-columns:60px repeat(7,1fr);gap:8px;align-items:center}
.spots .reihe .lab{font-size:10px}
.spots img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:8px;cursor:zoom-in;background:#111}
.spots .kopfz{font:600 11px/1.2 var(--sans);color:var(--ink2);text-align:center}
.spoth{overflow-x:auto}
.spoth .spots{min-width:620px}
.cap .medium{aspect-ratio:1088/640;cursor:zoom-in;background:#2A2928}
.optionen{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.optionen{grid-template-columns:1fr}}
.option{background:var(--card);border-radius:var(--r);padding:14px;display:grid;gap:10px;box-shadow:0 1px 0 var(--line)}
.option .oben{display:flex;align-items:center;gap:10px}
.option .oben b{font:600 16px/1 var(--sans)}
.option .oben .fav{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--paper);display:grid;place-items:center}
.option .oben .fav svg{width:18px;height:18px}
.option .oben .fav.an{background:var(--citron);color:#2A2928}

/* Leuchtkasten */
.kasten{position:fixed;inset:0;z-index:50;background:rgba(15,15,12,.86);display:grid;place-items:center;padding:24px}
.kasten[hidden]{display:none!important}
.kasten .inhalt{max-width:min(94vw,1100px);max-height:88vh;display:grid;place-items:center}
.kasten video,.kasten img{max-width:100%;max-height:84vh;border-radius:12px;background:#000}
.kasten .zu{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font:600 22px/40px var(--sans)}

/* Auswertung */
.lade{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end;background:rgba(15,15,12,.35)}
.lade[hidden]{display:none!important}
.lade .panel{width:min(520px,100%);height:100%;overflow:auto;background:var(--bg);padding:calc(20px + env(safe-area-inset-top,0px)) 22px 40px;display:grid;gap:26px;align-content:start;box-shadow:-20px 0 60px -30px rgba(0,0,0,.5)}
.lade h3{margin:0;font:400 34px/1 var(--serif);font-style:italic}
.lade .gruppe{display:grid;gap:10px}
.lade .panel{grid-template-columns:minmax(0,1fr)}
.lade .panel > *{min-width:0}
.lade .kopfzeile{display:flex;align-items:center;gap:12px}
.lade .zu{margin-left:auto;width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.lade .zu svg{width:14px;height:14px}
.balken{display:grid;grid-template-columns:120px 1fr 40px;gap:10px;align-items:center;font:600 13px/1.2 var(--sans)}
.balken .spur{height:8px;border-radius:99px;background:var(--paper);overflow:hidden}
.balken .spur i{display:block;height:100%;background:var(--accent);border-radius:99px}
.balken .w{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.rang{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;font:600 13px/1.3 var(--sans)}
.chips{display:flex;gap:4px;font-variant-numeric:tabular-nums}
.chips span{min-width:26px;height:22px;border-radius:6px;font:700 11px/22px var(--sans);text-align:center;color:#fff}
.chips .ok{background:var(--ok)} .chips .mid{background:var(--mid)} .chips .no{background:var(--no)}
.chips .leer{background:var(--paper);color:var(--ink2)}
.stimmen{display:grid;gap:8px}
.stimmen .zeile{font-size:13px;line-height:1.4;overflow-wrap:anywhere}
.stimmen .zeile b{font-weight:700}
.stimmen .zeile span{color:var(--ink2)}
.hinweis{color:var(--ink2);font:600 12px/1.4 var(--sans)}
footer{padding-block:80px 60px;color:var(--ink2);font:600 12px/1.5 var(--sans)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.karte{transition:none}}
/* Kommentare: anhaengen statt ueberschreiben */
.komm{position:relative}
.komm .eingabe{display:block;resize:none;overflow:hidden;max-height:160px}
.komm.hat .eingabe{padding-right:44px}
.senden{position:absolute;right:4px;bottom:4px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:none;place-items:center}
.komm.hat .senden{display:grid;animation:auf .18s cubic-bezier(.16,1,.3,1)}
@keyframes auf{from{transform:scale(.6)}to{transform:none}}
.senden svg{width:15px;height:15px}
.senden:disabled{opacity:.35;cursor:default}
.gespraech .zeile .zeit{color:var(--ink2);font-size:11px;margin-left:4px}
.status{display:flex;align-items:center;gap:6px;font:600 12px/1 var(--sans);color:var(--ink2)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.status[data-s="gespeichert"] i{background:var(--ok)}
.status[data-s="speichert"] i{background:var(--mid)}
.status[data-s="offline"] i{background:var(--no)}
.banner{margin-top:16px;padding:12px 16px;border-radius:12px;background:var(--citron);color:#2A2928;font:600 14px/1.4 var(--sans)}
.banner a{color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;margin-left:4px;white-space:nowrap}
.export{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* Team-Fassung: senden statt Datenbank */
.knopf.offen{position:relative}
.knopf.offen::after{content:"";position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--no);box-shadow:0 0 0 2px var(--bg)}
.gasthinweis{margin:0}
.feld{height:42px;min-height:42px;font-size:15px}
.vorschau{min-height:220px;max-height:none;resize:vertical;font:500 12px/1.5 var(--sans);white-space:pre-wrap}
.export .hinweis{flex-basis:100%}
@media (max-width:720px){.status span{display:none}}
/* Touch: groessere Ziele, kein Zoom beim Tippen */
@media (pointer:coarse){.eingabe{font-size:16px}.urteil button{height:42px}.senden{width:34px;height:34px}.komm.hat .eingabe{padding-right:46px}.medium .fav,.option .oben .fav{width:40px;height:40px}}
@media (max-width:520px){.info{padding:10px}.titel b{font-size:14px}}
</style>

<header class="kopf">
  <div class="wrap">
    <div class="marke">
      <svg viewBox="0 0 604.91 301.04" aria-label="Distrikt Marquet"><g id="logo"></g></svg>
      <span class="lab">Recruiting Spots · Fundament</span>
    </div>
    <div class="rechts">
      <div class="fort" title="Von dir bewertet"><svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--line)" stroke-width="4"/><circle id="ring" cx="18" cy="18" r="15" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 100" transform="rotate(-90 18 18)" pathLength="100"/></svg><span id="fortzahl">0 / 0</span></div>
      <span class="status" id="status" title="Speicherstand"><i></i><span></span></span>
      <div class="ich" id="ich"></div>
      <button class="knopf" id="auswertungKnopf">Auswertung</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="banner" id="banner" hidden></div>
  <section class="intro">
    <h1><b>Be the one</b> on day one.</h1>
    <nav class="fluss" id="fluss" aria-label="Vorgehen"></nav>
    <div class="legende" id="legende"></div>
  </section>
  <div id="abschnitte"></div>
</main>
<footer class="wrap" id="fuss">Distrikt Marquet · Food Affairs GmbH · Stand 30.9.2026</footer>

<div class="kasten" id="kasten" hidden><button class="zu" id="kastenZu" aria-label="Schließen">×</button><div class="inhalt" id="kastenInhalt"></div></div>

async function flush(){
  if (!db || !uid || !schreiben || schreibtGerade) return;
  if (!Object.keys(offen).length){ statusSetzen("gespeichert"); return; }
  schreibtGerade = true;
  const patch = offen; offen = {}; unterwegs = patch;
  const ref = db.doc("feedback/" + uid);
  let ok = false, spaeter = 0;
  try {
    if (!meinServer){
      const s = await ref.get();               // erst nachsehen, nie blind ersetzen
      if (s.exists){ meinServer = klon(s.data()); await ref.update(patch); }
      else { const voll = tiefMischen(tiefMischen(leer(), {seit: Date.now()}), patch); await ref.set(voll); meinServer = voll; }
    } else await ref.update(patch);
    tiefMischen(meinServer, patch);
    ok = true; versuche = 0;
  } catch (e) {
    offen = tiefMischen(klon(patch), offen);     // nichts verlieren: zurücklegen
    const code = e && e.code;
    if (code === "invalid_argument" && meinServer){
      try { const s = await ref.get(); if (!s.exists){ const voll = tiefMischen(tiefMischen(leer(), klon(meinServer)), offen); await ref.set(voll); meinServer = voll; offen = {}; ok = true; } } catch (e2) {}

    } else if (code === "quota_exceeded"){
      statusSetzen("offline"); bannerZeigen("Der Speicher des Boards ist voll. Deine letzten Eingaben sind noch nicht gespeichert, bitte Romeo Bescheid geben und die Seite offen lassen.");
    } else {
      versuche++; spaeter = Math.min(30000, 1500 * Math.pow(2, versuche - 1)) + Math.random() * 800;

    }
  } finally {
    unterwegs = {};
    schreibtGerade = false;
    offenMerken();
    if (ok) statusSetzen(Object.keys(offen).length ? "speichert" : "gespeichert");
    if (ok && Object.keys(offen).length){ clearTimeout(flushTimer); flushTimer = setTimeout(flush, 350); }

  const k = ta.parentNode; if (k) k.classList.toggle("hat", !!ta.value.trim());
  if (!ta.isConnected) return;
  ta.style.height = "auto";
  const h = ta.scrollHeight; ta.style.height = Math.min(h, 160) + "px"; ta.style.overflowY = h > 160 ? "auto" : "hidden";
}
function gespraechBlock(item){
  const box = el("div", {class:"gespraech"});
  const liste = el("div", {class:"gespraech"}); liste.dataset.liste = item.id;
  const ta = el("textarea", {class:"eingabe", rows:"1", placeholder:"Kommentar", "aria-label":"Kommentar", id:"k_" + item.id});
  ta.dataset.eingabe = item.id;
  ta.value = entwurfLesen(item.id);
  const knopf = el("button", {class:"senden", "aria-label":"Kommentar senden", title:"Senden", html: ICON.senden});
  knopf.dataset.senden = item.id;
  const senden = () => {
    const text = ta.value.trim().slice(0, 2000);
    if (!text) return;
    if (!aendern({k: {[item.id]: {[stempel()]: text}}})) return;
    ta.value = ""; entwurfSchreiben(item.id, "");
    knopf.disabled = true; feldAnpassen(ta);
  };
  ta.addEventListener("input", () => { entwurfSchreiben(item.id, ta.value); knopf.disabled = !schreiben || !ta.value.trim(); feldAnpassen(ta); });
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)){ e.preventDefault(); senden(); } });
  knopf.addEventListener("click", senden);
  knopf.disabled = !ta.value.trim();
  box.appendChild(liste);
  box.appendChild(el("div", {class:"komm"}, [ta, knopf]));
  feldAnpassen(ta);
  return box;
}

    m.appendChild(v);

/* ---------- Videos: nur sichtbare laufen, Poster steht immer ---------- */
function videosBeobachten(){
  if (!("IntersectionObserver" in window)) return;
  const io = new IntersectionObserver(eintraege => {
    eintraege.forEach(e => {
      const v = e.target;
      if (e.isIntersecting){ if (!v.src) v.src = v.dataset.src; const p = v.play(); if (p && p.catch) p.catch(() => {}); }
      else v.pause();
    });
  }, {rootMargin:"120px 0px", threshold:0.25});
  document.querySelectorAll("video[data-src]").forEach(v => io.observe(v));
}
function oeffnen(item){
  const ziel = document.getElementById("kastenInhalt");
  ziel.innerHTML = "";
  if (item.video){
    const v = el("video", {controls:"", autoplay:"", loop:"", playsinline:"", poster:item.poster, src:item.video});
    ziel.appendChild(v);
  } else ziel.appendChild(el("img", {src:item.poster, alt:item.titel || ""}));
  document.getElementById("kasten").hidden = false;
}
function schliessen(){

/* ---------- Auswertung und Export: alles, auch Verlauf und entfernte Assets ---------- */
function assetInfo(id){
  let n = 0;
  for (const ab of D.abschnitte) for (const i of ab.items){ n++; if (i.id === id) return {station: ab.nr + " " + ab.titel, asset: i.titel + (i.sub ? " " + i.sub : ""), rang: n}; }
  return {station: "nicht mehr im Board", asset: id || "", rang: 9999};
}
function csvZeile(a){ return a.map(x => { const s = String(x == null ? "" : x); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(";"); }
function verlaufLesen(e){
  e = String(e);
  if (e.startsWith("fav:")){ const r = e.slice(4), i = r.lastIndexOf("="), teil = r.slice(0, i).split(":"); return {id: teil[teil.length - 1], wert: r.slice(i + 1) === "an" ? "Favorit an" : "Favorit aus"}; }
  const i = e.lastIndexOf("="), w = e.slice(i + 1);
  return {id: e.slice(0, i), wert: w === "-" ? "zurückgenommen" : (WORT[w] || w)};
}
function exportZeilen(){
  const q = quelle(), zeilen = [], ART = {Urteil:1, Favorit:2, Kommentar:3, Verlauf:4};
  const rein = (name, id, art, wert, ms) => { const a = assetInfo(id); zeilen.push({name, art, rang: a.rang, ms: ms || 0, z: [name, a.station, a.asset, art, wert, zeitText(ms)]}); };
  for (const u in q){
    const d = q[u], name = (namen[u] && namen[u].name) || d.name || (u === uid ? "Du" : u);
    const h = d.h || {}, zuletzt = {};
    Object.keys(h).forEach(s => { const x = verlaufLesen(h[s]); zuletzt[x.id] = Math.max(zuletzt[x.id] || 0, zeitAus(s)); rein(name, x.id, "Verlauf", x.wert, zeitAus(s)); });
    const v = d.v || {}; for (const id in v) if (v[id]) rein(name, id, "Urteil", WORT[v[id]] || v[id], zuletzt[id]);
    const f = d.f || {};
    for (const g in f){
      const x = f[g], ids = [];
      if (typeof x === "string" && x) ids.push(x);
      else if (Array.isArray(x)) x.forEach(i => ids.push(i));
      else if (istObj(x)) for (const i in x) if (x[i] === true) ids.push(i);
      ids.forEach(i => rein(name, i, "Favorit", "ja", 0));
    }
    const k = d.k || {}; for (const id in k) if (istObj(k[id])) for (const s in k[id]) if (k[id][s]) rein(name, id, "Kommentar", k[id][s], zeitAus(s));
    const c = d.c || {}; for (const id in c) if (typeof c[id] === "string" && c[id]) rein(name, id, "Kommentar", c[id], d.t);
  }
  zeilen.sort((a, b) => a.name.localeCompare(b.name) || ART[a.art] - ART[b.art] || (a.art === "Verlauf" ? a.ms - b.ms : a.rang - b.rang || a.ms - b.ms));
  return [["Person", "Station", "Asset", "Art", "Wert", "Zeit"]].concat(zeilen.map(x => x.z));
}
function exportText(){ return "\ufeff" + exportZeilen().map(csvZeile).join("\r\n"); }
async function exportieren(knopf, art){
  const datum = new Date().toISOString().slice(0, 10);
  const text = art === "json" ? JSON.stringify({board: "Distrikt Marquet Feedback", stand: new Date().toISOString(), namen, feedback: quelle()}, null, 2) : exportText();
  const name = "Distrikt_Marquet_Feedback_" + datum + (art === "json" ? ".json" : ".csv");
  if (dl){
    try { await dl.save({filename: name, data: text}); knopf.textContent = "Gespeichert"; return; }
    catch (e) { if (e && (e.code === "declined" || e.code === "rate_limited")) return; }
  }
  try { await navigator.clipboard.writeText(text); knopf.textContent = "Kopiert"; }
  catch (e) { const ta = el("textarea", {class:"eingabe", style:"min-height:160px;width:100%"}); ta.value = text; knopf.parentNode.after(ta); ta.select(); }
}

/* ---------- Namen auflösen ---------- */
async function namenAufloesen(){
  if (!user) return;
  const ids = Object.keys(alle);
  if (!ids.length) return;
  const vorher = JSON.stringify(namen);
  try { const ps = await user.profiles(ids); for (const id in ps) namen[id] = {name: ps[id].name, avatarUrl: ps[id].avatarUrl}; } catch (e) {}
  if (JSON.stringify(namen) !== vorher) alleNeuZeichnen();
}

/* ---------- Live-Abo: einmal, nach Abbruch neu ---------- */
function abonnieren(){
  db.collection("feedback").onSnapshot(snap => {
    const neu = {};
    snap.docs.forEach(d => { if (d.exists) neu[d.id] = d.data(); });
    alle = neu;
    if (uid && neu[uid]) meinServer = klon(neu[uid]);
    dbBereit = true;
    if (schreiben) statusSetzen(ausstehend() ? "speichert" : "gespeichert");
    offenWiederholen();
    alleNeuZeichnen();
    namenAufloesen();
  }, e => {
    const code = e && e.code;
    if (code === "revoked" || code === "not_granted" || code === "invalid_argument"){ nurLesen(); alleNeuZeichnen(); return; }
    statusSetzen("offline");
    setTimeout(abonnieren, 4000 + Math.random() * 2000);
  });
}

function gastLaden(){
  let x = null; try { x = JSON.parse(localStorage.getItem(GAST_KEY) || "null"); } catch (e) {}
  if (!istObj(x) || !x.i) x = {i: Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4), n: "", v:{}, f:{}, k:{}, h:{}, seit: Date.now(), stand: 0, gesendet: 0};
  return x;
}
function gastSpeichern(){ try { localStorage.setItem(GAST_KEY, JSON.stringify(lokal)); } catch (e) {} }
function gastOffen(){ return (lokal.stand || 0) > (lokal.gesendet || 0); }
function b64url(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function gastCode(){ return "DMFB1." + b64url(JSON.stringify({i: lokal.i, n: lokal.n, q: KANAL, t: Date.now(), v: lokal.v, f: lokal.f, k: lokal.k, h: lokal.h})) + ".ENDE"; }
function assetName(ab, it){ return ab.items.length === 1 && !it.sub ? ab.titel : it.titel + (it.sub ? " " + it.sub : ""); }
function gastZahlen(){
  const m = mein(); let u = 0, k = 0, f = 0;
  for (const id in m.v) if (m.v[id]) u++;
  for (const id in m.k) if (istObj(m.k[id])) for (const s in m.k[id]) if (m.k[id][s]) k++;
  D.abschnitte.forEach(ab => { if (ab.favorit) ab.items.forEach(it => { if (hatFav(m, ab.favorit, it.id)) f++; }); });
  return {u, k, f};
}
function gastText(){
  const m = mein(), z = ["Distrikt Marquet Feedback" + (KANAL ? " " + KANAL : "") + " · " + (lokal.n || "ohne Namen"), zeitText(Date.now())];
  D.abschnitte.forEach(ab => {
    const block = [];
    ab.items.forEach(it => {
      const teile = [];
      if (m.v[it.id]) teile.push(WORT[m.v[it.id]]);
      if (ab.favorit && hatFav(m, ab.favorit, it.id)) teile.push("Favorit");
      const ks = kommentare(it.id);
      if (!teile.length && !ks.length) return;
      block.push(assetName(ab, it) + (teile.length ? ": " + teile.join(", ") : ""));
      ks.forEach(k => block.push("„" + k.text + "“"));
    });
    if (block.length) z.push("", ab.nr + " " + ab.titel, ...block);
  });
  z.push("", "Code für Romeos Auswertung, bitte mitschicken:", gastCode());
  return z.join("\n");
}
function sendenOeffnen(){
  const p = document.getElementById("ladePanel");
  p.innerHTML = "";
  p.appendChild(el("div", {class:"kopfzeile"}, [el("h3", {text:"Senden"}), el("button", {class:"zu", "aria-label":"Schließen", title:"Schließen", html: ICON_ZU, onclick: () => document.getElementById("lade").hidden = true})]));
  const name = el("input", {class:"eingabe feld", type:"text", placeholder:"Dein Name", "aria-label":"Dein Name", autocomplete:"name", maxlength:"60"});
  name.value = lokal.n || "";
  const z = gastZahlen();
  const text = el("textarea", {class:"eingabe vorschau", readonly:"", "aria-label":"Nachricht an Romeo"});
  const meldung = el("p", {class:"hinweis"});
  const aktualisieren = () => { lokal.n = name.value.trim().slice(0, 60); gastSpeichern(); text.value = gastText(); };
  name.addEventListener("input", aktualisieren);
  aktualisieren();
  const nameDa = () => { if (lokal.n) return true; name.focus(); meldung.textContent = "Bitte zuerst deinen Namen eintragen."; return false; };
  const fertig = t => { lokal.gesendet = Date.now(); gastSpeichern(); meldung.textContent = t; alleNeuZeichnen(); };
  const betreff = () => "Distrikt Marquet Feedback" + (KANAL ? " " + KANAL : "") + " · " + lokal.n;
  const markieren = () => { text.focus(); text.select(); try { text.setSelectionRange(0, text.value.length); } catch (e) {} };
  const perMail = () => {
    const a = el("a", {href: "mailto:?subject=" + encodeURIComponent(betreff()) + "&body=" + encodeURIComponent(text.value), target:"_blank", rel:"noopener"});
    document.body.appendChild(a); a.click(); a.remove();
    fertig("Mail an Romeo schicken. Falls sich nichts geöffnet hat: Kopieren.");
  };
  const kopieren = async () => {
    let ok = false;
    try { await navigator.clipboard.writeText(text.value); ok = true; } catch (e) {}
    if (!ok){ markieren(); try { ok = document.execCommand("copy"); } catch (e) {} }
    if (ok) fertig("Kopiert. Jetzt in WhatsApp, Slack oder Mail an Romeo einfügen.");
    else { markieren(); meldung.textContent = "Text ist markiert. Bitte kopieren und an Romeo schicken."; }
  };
  const haupt = el("button", {class:"knopf", text:"An Romeo senden"});
  haupt.addEventListener("click", async () => {
    if (!nameDa()) return;
    aktualisieren();
    if (navigator.share){
      try { await navigator.share({title: betreff(), text: text.value}); fertig("Gesendet. Danke!"); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    perMail();
  });
  const mail = el("button", {class:"knopf leise", text:"Per Mail"}); mail.addEventListener("click", () => { if (nameDa()){ aktualisieren(); perMail(); } });
  const kopie = el("button", {class:"knopf leise", text:"Kopieren"}); kopie.addEventListener("click", () => { if (nameDa()){ aktualisieren(); kopieren(); } });
  p.appendChild(name);
  const zahl = (n, eins, viele) => n + " " + (n === 1 ? eins : viele);
  p.appendChild(el("span", {class:"lab", text: zahl(z.u, "Urteil", "Urteile") + " · " + zahl(z.k, "Kommentar", "Kommentare") + " · " + zahl(z.f, "Favorit", "Favoriten")}));
  p.appendChild(el("div", {class:"export"}, [haupt, mail, kopie]));
  p.appendChild(meldung);
  p.appendChild(text);
  if (lokal.gesendet) meldung.textContent = "Zuletzt gesendet " + zeitText(lokal.gesendet) + (gastOffen() ? ", seitdem geändert." : ".");
  document.getElementById("lade").hidden = false;
  if (!lokal.n) name.focus();
}
/* Live-Fassung: alles geht automatisch an den Feedback-Server, zusätzlich bleibt es im Browser */
let serverTimer = null, serverLaeuft = false;
function gastPaket(){ return JSON.stringify({i: lokal.i, n: lokal.n, t: Date.now(), v: lokal.v, f: lokal.f, k: lokal.k, h: lokal.h}); }
function serverPlanen(){ clearTimeout(serverTimer); statusSetzen("speichert"); serverTimer = setTimeout(serverSenden, 600); }
async function serverSenden(){
  if (serverLaeuft){ serverPlanen(); return; }
  serverLaeuft = true;
  const stand = lokal.stand;
  try {
    const r = await fetch(API, {method: "POST", headers: {"Content-Type": "application/json"}, body: gastPaket(), keepalive: true});
    if (!r.ok) throw new Error("HTTP " + r.status);
    lokal.gesendet = Math.max(lokal.gesendet || 0, stand); gastSpeichern();
    if (gastOffen()) serverPlanen(); else statusSetzen("gespeichert");
  } catch (e) {
    statusSetzen("offline"); clearTimeout(serverTimer); serverTimer = setTimeout(serverSenden, 4000);
  } finally { serverLaeuft = false; alleNeuZeichnen(); }
}
function letzteChance(){ if (API && lokal && gastOffen() && navigator.sendBeacon) navigator.sendBeacon(API, new Blob([gastPaket()], {type: "text/plain"})); }
function nameZuerst(){ return TEAM && (!!API || KANAL === "Kunde"); }   // Name ist Pflicht, bevor bewertet wird
function nameFragen(){
  const p = document.getElementById("ladePanel");
  p.innerHTML = "";
  const kunde = KANAL === "Kunde";
  const name = el("input", {class:"eingabe feld", type:"text", placeholder: kunde ? "Name" : "Dein Name", "aria-label":"Name", autocomplete:"name", maxlength:"60"});
  const los = el("button", {class:"knopf", text:"Los geht’s"});
  const weiter = () => { const n = name.value.trim(); if (!n){ name.focus(); return; } lokal.n = n.slice(0, 60); lokal.stand = Date.now(); gastSpeichern(); document.getElementById("lade").hidden = true; if (API) serverPlanen(); else alleNeuZeichnen(); };
  los.addEventListener("click", weiter);
  name.addEventListener("keydown", e => { if (e.key === "Enter") weiter(); });
  p.appendChild(el("div", {class:"kopfzeile"}, [el("h3", {text: kunde ? "Willkommen" : "Hallo"})]));
  p.appendChild(el("p", {class:"hinweis", text: kunde ? "Bitte zuerst den Namen eintragen, damit das Feedback zugeordnet werden kann." : "Wie heißt du? Damit Romeo dein Feedback zuordnen kann."}));
  p.appendChild(name);
  p.appendChild(el("div", {class:"export"}, [los]));
  document.getElementById("lade").hidden = false;
  setTimeout(() => name.focus(), 50);
}
function gastStart(){
  lokal = gastLaden(); gastSpeichern();
  uid = "gast_" + lokal.i; schreiben = true; dbBereit = true;
  document.getElementById("status").style.display = "none";
  document.getElementById("ich").style.display = "none";
  if (API){
    document.getElementById("status").style.display = "";
    document.getElementById("auswertungKnopf").style.display = "none";
    document.getElementById("legende").after(el("p", {class:"hinweis gasthinweis", text:"Bewerten, kommentieren, Favoriten setzen. Alles wird automatisch gespeichert."}));
    window.addEventListener("pagehide", letzteChance);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") letzteChance(); });
    if (!lokal.n) nameFragen();
    if (gastOffen()) serverPlanen(); else statusSetzen("gespeichert");
  } else {
    document.getElementById("auswertungKnopf").textContent = "Senden";
    document.getElementById("legende").after(el("p", {class:"hinweis gasthinweis", text: KANAL === "Kunde" ? "Bewerten, kommentieren, Favoriten setzen. Zum Schluss oben auf Senden tippen." : "Alles bleibt auf deinem Gerät, bis du oben auf Senden tippst."}));
    if (nameZuerst() && !lokal.n) nameFragen();
  }
  if (location.protocol === "file:" && TEAM_URL){
    bannerZeigen("Das ist nur eine Kopie der Datei, ohne Videos.");
    document.getElementById("banner").appendChild(el("a", {href: TEAM_URL, target:"_blank", rel:"noopener", text:"Board öffnen"}));
  }
  alleNeuZeichnen();
}

aufbauen();
if (TEAM) gastStart();
